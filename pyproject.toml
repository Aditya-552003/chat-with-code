[project]
name = "chat-with-code"
version = "2.0.0"
description = "Conversational code explorer with RAG"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "streamlit",
    "python-dotenv",
    "google-generativeai", 
    "llama_index.llms.google_genai",
    "llama-index-embeddings-huggingface",
    "llama-index-readers-github", 
    "llama-index",
    "nest_asyncio"
]

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["backend/tests"]
asyncio_mode = "auto"